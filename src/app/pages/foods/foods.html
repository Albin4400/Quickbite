
<div class="container text-center">
  @if (errorMessage()) {
    <div class="alert alert-warning mt-3" role="status">{{ errorMessage() }}</div>
  }
  @if (loading()) {
    <p class="mt-5" role="status">Loading the menu…</p>
  } @else {
    <div class="row">
      @for (food of foods(); track food.key) {
        <div class="col">
          <app-cards [product]="food"></app-cards>
        </div>
      } @empty {
        <p class="mt-5">There are no menu items available right now.</p>
      }
    </div>
  }
</div>
