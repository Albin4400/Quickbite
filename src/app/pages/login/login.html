<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">
        <span class="brand-icon">🍕</span>
        <span class="brand-title">QuickBite</span>
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to crave your favorite meals in minutes</p>
    </div>

    <!-- Form-Level Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger custom-alert d-flex align-items-center" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16">
        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
      </svg>
      <div>{{ errorMessage }}</div>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Email Field -->
      <div class="form-group mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-container">
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control custom-input"
            [ngClass]="{ 'is-invalid': email?.invalid && (email?.dirty || email?.touched) }"
            placeholder="name@example.com"
            autocomplete="email"
          />
        </div>
        <!-- Inline Validation Errors -->
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="invalid-feedback d-block">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label mb-0">Password</label>
        </div>
        <div class="input-container position-relative">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="form-control custom-input pe-5"
            [ngClass]="{ 'is-invalid': password?.invalid && (password?.dirty || password?.touched) }"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
            aria-label="Toggle password visibility"
          >
            {{ showPassword ? '👁️' : '🙈' }}
          </button>
        </div>
        <!-- Inline Validation Errors -->
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="invalid-feedback d-block">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary btn-submit w-100 mb-3"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span *ngIf="isLoading">Signing in...</span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>

      <!-- Footer Link -->
      <div class="auth-footer text-center">
        <p class="mb-0 text-muted">
          Don't have an account?
          <a routerLink="/register" class="auth-link fw-semibold">Sign up for QuickBite</a>
        </p>
      </div>
    </form>
  </div>
</div>
