<div id="foodCarousel" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#foodCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#foodCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#foodCarousel" data-bs-slide-to="2"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">

    <!-- Slide 1 -->
    <div class="carousel-item active">
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600&auto=format&fit=crop"
           class="d-block w-100 carousel-img"
           alt="Food Image">

      <div class="carousel-caption">
        <h1>Delicious Meals Delivered</h1>
        <p>Fresh food at your doorstep.</p>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=1600&auto=format&fit=crop"
           class="d-block w-100 carousel-img"
           alt="Burger">

      <div class="carousel-caption">
        <h1>Tasty Burgers & Snacks</h1>
        <p>Enjoy your favorite fast food anytime.</p>
      </div>
    </div>

    <!-- Slide 3 -->
    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?q=80&w=1600&auto=format&fit=crop"
           class="d-block w-100 carousel-img"
           alt="Pizza">

      <div class="carousel-caption">
        <h1>Hot & Cheesy Pizza</h1>
        <p>Made with love and fresh ingredients.</p>
      </div>
    </div>

  </div>

  <!-- Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#foodCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#foodCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>

</div>
