<a class="card food-card" [routerLink]="['/recipedetails', product().key]">

  <img [src]="product().imageUrl"
    class="card-img-top"
    [alt]="product().name"
  >

  <div class="card-body">
    <p class="card-text">{{ product().name }}</p>
    <span class="food-source">{{ product().source === 'admin' ? 'QuickBite kitchen' : 'Recipe inspiration' }}</span>
  </div>

</a>
